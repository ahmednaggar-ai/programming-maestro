<svg
  class="logo"
  [class.logo--mark]="variant() === 'mark'"
  [class.logo--compact]="variant() === 'compact'"
  [attr.viewBox]="viewBox()"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  [attr.aria-label]="alt()"
>
  <title>{{ alt() }}</title>
  <defs>
    <linearGradient [attr.id]="uid + '-goldLinear'" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="25%" stop-color="#fde047" />
      <stop offset="60%" stop-color="#eab308" />
      <stop offset="85%" stop-color="#ca8a04" />
      <stop offset="100%" stop-color="#854d0e" />
    </linearGradient>

    <linearGradient [attr.id]="uid + '-goldMetallic'" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#eab308" />
      <stop offset="70%" stop-color="#a16207" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>

    <radialGradient [attr.id]="uid + '-goldGlow'" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#eab308" stop-opacity="0" />
    </radialGradient>

    <linearGradient [attr.id]="uid + '-silverAccent'" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <filter [attr.id]="uid + '-shadow'" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.45" />
    </filter>

    <filter [attr.id]="uid + '-glow'" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  @if (variant() === 'full') {
    <circle cx="450" cy="230" r="210" [attr.fill]="'url(#' + uid + '-goldGlow)'" />

    <g opacity="0.35" [attr.filter]="'url(#' + uid + '-shadow)'">
      <path
        d="M 220 230 A 230 230 0 0 1 680 230"
        fill="none"
        [attr.stroke]="'url(#' + uid + '-goldLinear)'"
        stroke-width="2"
        stroke-dasharray="6 8"
      />
      <path
        d="M 190 230 A 260 260 0 0 1 710 230"
        fill="none"
        [attr.stroke]="'url(#' + uid + '-goldLinear)'"
        stroke-width="1.5"
      />
    </g>

    <g stroke-linecap="round" fill="none" [attr.stroke]="'url(#' + uid + '-goldLinear)'">
      <path
        d="M 160,250 C 260,140 380,310 450,220 C 520,130 640,300 740,210"
        stroke-width="3"
        opacity="0.75"
      />
      <path
        d="M 180,265 C 270,165 370,325 450,235 C 530,145 630,315 720,225"
        stroke-width="1.5"
        opacity="0.5"
      />
      <path
        d="M 200,280 C 280,190 360,340 450,250 C 540,160 620,330 700,240"
        stroke-width="1"
        opacity="0.3"
      />
    </g>
  }

  <g [attr.filter]="'url(#' + uid + '-shadow)'">
    <path
      d="M 280,310 C 260,325 240,320 235,305 C 230,290 245,275 265,285 Z"
      [attr.fill]="'url(#' + uid + '-goldLinear)'"
    />
    <path
      d="M 270,295 L 630,130"
      [attr.stroke]="'url(#' + uid + '-silverAccent)'"
      stroke-width="4.5"
      stroke-linecap="round"
    />
    <path
      d="M 270,295 L 630,130"
      [attr.stroke]="'url(#' + uid + '-goldLinear)'"
      stroke-width="2"
      stroke-linecap="round"
    />
    <circle
      cx="630"
      cy="130"
      r="4"
      fill="#ffffff"
      [attr.filter]="'url(#' + uid + '-glow)'"
    />

    <path
      d="M 450,90 C 470,90 490,105 485,130 C 480,155 450,165 435,185 C 420,205 425,235 450,250 C 480,268 530,240 550,200"
      fill="none"
      [attr.stroke]="'url(#' + uid + '-goldLinear)'"
      stroke-width="7"
      stroke-linecap="round"
    />
    <path
      d="M 360,200 C 390,160 430,150 450,180 C 470,210 420,260 380,250 C 350,240 340,210 370,180 C 400,150 460,110 450,80"
      fill="none"
      [attr.stroke]="'url(#' + uid + '-goldMetallic)'"
      stroke-width="5"
      stroke-linecap="round"
    />

    <circle cx="550" cy="190" r="6" [attr.fill]="'url(#' + uid + '-goldLinear)'" />
    <circle cx="350" cy="260" r="5" [attr.fill]="'url(#' + uid + '-goldLinear)'" />
    <path
      d="M 610,170 Q 620,150 630,160 T 620,180 Z"
      [attr.fill]="'url(#' + uid + '-goldLinear)'"
    />
  </g>

  @if (variant() !== 'mark') {
    <g>
      <text
        x="450"
        y="385"
        font-family="Amiri, Cairo, serif"
        font-size="52"
        font-weight="bold"
        text-anchor="middle"
        [attr.fill]="'url(#' + uid + '-goldLinear)'"
        [attr.filter]="'url(#' + uid + '-shadow)'"
        letter-spacing="1"
      >
        مستر حسام النجار
      </text>

      <g transform="translate(0, 10)">
        <line
          x1="220"
          y1="435"
          x2="340"
          y2="435"
          [attr.stroke]="'url(#' + uid + '-goldLinear)'"
          stroke-width="2"
          stroke-linecap="round"
        />
        <circle cx="340" cy="435" r="3.5" [attr.fill]="'url(#' + uid + '-goldLinear)'" />

        <text
          x="450"
          y="442"
          font-family="Cairo, sans-serif"
          font-size="22"
          font-weight="700"
          text-anchor="middle"
          fill="#e2e8f0"
          letter-spacing="6"
        >
          ا لـ مـ ا يـ سـ تـ ر و
        </text>

        <circle cx="560" cy="435" r="3.5" [attr.fill]="'url(#' + uid + '-goldLinear)'" />
        <line
          x1="560"
          y1="435"
          x2="680"
          y2="435"
          [attr.stroke]="'url(#' + uid + '-goldLinear)'"
          stroke-width="2"
          stroke-linecap="round"
        />
      </g>

      @if (variant() === 'full') {
        <text
          x="450"
          y="478"
          font-family="Cairo, sans-serif"
          font-size="16"
          font-weight="700"
          text-anchor="middle"
          fill="#fcd34d"
          letter-spacing="1"
        >
          مدير عام بوزارة التربية والتعليم
        </text>
        <text
          x="450"
          y="508"
          font-family="Cairo, sans-serif"
          font-size="12"
          font-weight="600"
          text-anchor="middle"
          fill="#94a3b8"
          letter-spacing="6"
        >
          THE MAESTRO • HOSSAM EL-NAGGAR
        </text>
      }
    </g>
  }
</svg>
