<div class="shell">
  <header class="topbar">
    <a
      class="brand"
      routerLink="/"
      aria-label="مستر حسام النجار — مدير عام بوزارة التربية والتعليم"
    >
      <span class="brand__mark" aria-hidden="true">
        <app-brand-logo variant="mark" />
      </span>
      <span class="brand__copy">
        <span class="brand__text">مستر حسام النجار</span>
        <span class="brand__sub">المايسترو · مدير عام بوزارة التربية والتعليم</span>
      </span>
    </a>

    <div class="topbar__actions">
      <nav class="nav" aria-label="القائمة الرئيسية">
        <a routerLink="/" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }">
          الدروس
        </a>
        <a routerLink="/playground" routerLinkActive="is-active">المحرر</a>
      </nav>

      <button
        type="button"
        class="btn btn--icon theme-toggle"
        (click)="toggleTheme()"
        [attr.aria-label]="
          themeService.theme() === 'dark' ? 'تفعيل الوضع الفاتح' : 'تفعيل الوضع الداكن'
        "
        [title]="themeService.theme() === 'dark' ? 'الوضع الفاتح' : 'الوضع الداكن'"
      >
        @if (themeService.theme() === 'dark') {
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path
              fill="currentColor"
              d="M12 4.5a1 1 0 0 1 1 1V7a1 1 0 1 1-2 0V5.5a1 1 0 0 1 1-1Zm0 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Zm7.5-3.5a1 1 0 0 1-1 1H17a1 1 0 1 1 0-2h1.5a1 1 0 0 1 1 1ZM7 12a1 1 0 0 1-1 1H4.5a1 1 0 1 1 0-2H6a1 1 0 0 1 1 1Zm9.95 5.45a1 1 0 0 1-1.4 1.4l-1.06-1.05a1 1 0 0 1 1.41-1.41l1.05 1.06ZM8.51 7.05A1 1 0 0 1 7.1 5.64L6.05 4.6A1 1 0 0 1 7.46 3.18l1.05 1.06a1 1 0 0 1 0 1.41Zm8.44-2.45a1 1 0 0 1 0 1.41L15.9 7.05A1 1 0 1 1 14.5 5.64l1.05-1.06a1 1 0 0 1 1.4 0ZM8.51 16.95l-1.05 1.06A1 1 0 1 1 6.05 16.6l1.05-1.06a1 1 0 0 1 1.41 1.41Z"
            />
          </svg>
        } @else {
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path
              fill="currentColor"
              d="M17.93 14.02A7.5 7.5 0 0 1 9.98 6.07a7.5 7.5 0 1 0 7.95 7.95Z"
            />
          </svg>
        }
      </button>
    </div>
  </header>

  <main class="shell__main">
    <router-outlet />
  </main>
</div>
